<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MakerLab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Arimo&family=Lobster&family=Pacifico&family=Poppins&family=Roboto&display=swap" rel="stylesheet">
    <style>
        /* Custom scrollbar for clean UI */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col overflow-hidden font-sans">

    <header class="bg-gray-800 px-4 py-2 flex justify-between items-center border-b border-gray-700 h-14">
        <div class="flex items-center space-x-4">
            <h1 class="text-lg font-black tracking-wider text-cyan-400">PIXELLAB <span class="text-xs font-normal text-gray-400">PRO</span></h1>
            <div class="flex items-center bg-gray-700 rounded p-0.5 space-x-1 text-sm">
                <button id="undoBtn" class="px-2.5 py-1 hover:bg-gray-600 rounded" title="Undo">↩</button>
                <button id="redoBtn" class="px-2.5 py-1 hover:bg-gray-600 rounded" title="Redo">↪</button>
            </div>
        </div>
        
        <div class="flex items-center space-x-2 text-xs">
            <span class="text-gray-400">Aspect Ratio:</span>
            <select id="canvasPreset" class="bg-gray-700 border border-gray-600 rounded px-2 py-1 focus:outline-none">
                <option value="1:1">Custom (1:1)</option>
                <option value="16:9">YouTube Thumbnail (16:9)</option>
                <option value="4:5">Instagram Post (4:5)</option>
                <option value="820:312">Facebook Banner</option>
            </select>
        </div>

        <div class="flex items-center space-x-2">
            <button id="openProject" class="bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded text-xs font-medium">Open Project</button>
            <button id="saveProject" class="bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded text-xs font-medium">Save Project</button>
            <select id="exportFormat" class="bg-gray-700 border border-gray-600 rounded px-2 py-1.5 text-xs focus:outline-none">
                <option value="png">PNG (Transparent)</option>
                <option value="jpeg">JPG (High Res)</option>
            </select>
            <button id="exportBtn" class="bg-cyan-600 hover:bg-cyan-500 px-4 py-1.5 rounded text-xs font-bold uppercase tracking-wider">Export</button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
        
        <aside class="w-80 bg-gray-800 border-r border-gray-700 flex flex-col">
            <div class="flex border-b border-gray-700 text-xs font-medium text-center">
                <button onclick="switchTab('text-tab')" class="tab-btn flex-1 py-3 bg-gray-750 text-cyan-400 border-b-2 border-cyan-400" id="btn-text-tab">TEXT</button>
                <button onclick="switchTab('image-tab')" class="tab-btn flex-1 py-3 hover:bg-gray-750 text-gray-400" id="btn-image-tab">IMAGE / SHAPE</button>
                <button onclick="switchTab('bg-tab')" class="tab-btn flex-1 py-3 hover:bg-gray-750 text-gray-400" id="btn-bg-tab">BG</button>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-5 text-sm">
                
                <div id="text-tab" class="tab-content space-y-4">
                    <button id="addText" class="w-full bg-cyan-600 hover:bg-cyan-500 py-2 rounded font-medium text-xs uppercase">+ Add New Text</button>
                    
                    <div class="border-t border-gray-700 pt-3 space-y-3">
                        <label class="block text-xs text-gray-400 uppercase">Text Properties</label>
                        <input type="text" id="textString" class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm focus:border-cyan-500 focus:outline-none" placeholder="Edit selected text...">
                        
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs text-gray-500 mb-1">Font Family</label>
                                <select id="fontFamily" class="w-full bg-gray-900 border border-gray-700 rounded p-1.5 text-xs">
                                    <option value="sans-serif">System Sans</option>
                                    <option value="Poppins">Poppins</option>
                                    <option value="Roboto">Roboto</option>
                                    <option value="Lobster">Lobster (Script)</option>
                                    <option value="Pacifico">Pacifico (Curved)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs text-gray-500 mb-1">Import .TTF</label>
                                <input type="file" id="customFont" accept=".ttf,.otf" class="w-full text-xs text-gray-400 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:bg-gray-700 file:text-gray-200 cursor-pointer">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs text-gray-500 mb-1">Fill Type</label>
                            <div class="flex space-x-2 mb-2">
                                <label><input type="radio" name="textFillType" value="solid" checked> Solid</label>
                                <label><input type="radio" name="textFillType" value="gradient"> Gradient</label>
                                <label><input type="radio" name="textFillType" value="texture"> Texture</label>
                            </div>
                            <div id="solidColorPickers" class="flex items-center space-x-2">
                                <input type="color" id="textColor" class="w-8 h-8 bg-transparent border-0 cursor-pointer">
                                <span class="text-xs text-gray-400">Choose Text Color</span>
                            </div>
                            <div id="texturePicker" class="hidden">
                                <input type="file" id="textTextureFile" accept="image/*" class="text-xs">
                            </div>
                        </div>

                        <div class="space-y-2 text-xs">
                            <div>
                                <div class="flex justify-between"><span>Size</span><span id="v-size">40</span></div>
                                <input type="range" id="textSize" min="10" max="150" value="40" class="w-full accent-cyan-500">
                            </div>
                            <div>
                                <div class="flex justify-between"><span>Opacity</span><span id="v-opac">100</span></div>
                                <input type="range" id="textOpacity" min="0" max="100" value="100" class="w-full accent-cyan-500">
                            </div>
                            <div>
                                <div class="flex justify-between"><span>Letter Spacing</span><span id="v-lspace">0</span></div>
                                <input type="range" id="letterSpacing" min="-5" max="30" value="0" class="w-full accent-cyan-500">
                            </div>
                            <div>
                                <div class="flex justify-between"><span>Line Height</span><span id="v-lheight">1.2</span></div>
                                <input type="range" id="lineHeight" min="0.5" max="2.5" step="0.1" value="1.2" class="w-full accent-cyan-500">
                            </div>
                            <div>
                                <div class="flex justify-between"><span>Rotation</span><span id="v-rot">0°</span></div>
                                <input type="range" id="textRotation" min="0" max="360" value="0" class="w-full accent-cyan-500">
                            </div>
                            <div>
                                <div class="flex justify-between"><span>Curved Text (Warp)</span><span id="v-curve">0</span></div>
                                <input type="range" id="textCurve" min="-100" max="100" value="0" class="w-full accent-cyan-500">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs text-gray-500 mb-1">Alignment</label>
                            <div class="grid grid-cols-3 gap-1 bg-gray-900 p-1 rounded text-center text-xs">
                                <button id="alignLeft" class="py-1 hover:bg-gray-700 rounded font-bold">Left</button>
                                <button id="alignCenter" class="py-1 bg-gray-700 text-cyan-400 rounded font-bold">Center</button>
                                <button id="alignRight" class="py-1 hover:bg-gray-700 rounded font-bold">Right</button>
                            </div>
                        </div>

                        <div class="space-y-2 pt-2 border-t border-gray-700">
                            <label class="block text-xs text-gray-400 uppercase">Text Effects (FX)</label>
                            <div class="grid grid-cols-2 gap-2 text-xs">
                                <label class="flex items-center space-x-2 bg-gray-900 p-2 rounded cursor-pointer"><input type="checkbox" id="fxStroke"> <span>Outline/Stroke</span></label>
                                <label class="flex items-center space-x-2 bg-gray-900 p-2 rounded cursor-pointer"><input type="checkbox" id="fxShadow"> <span>Outer Shadow</span></label>
                                <label class="flex items-center space-x-2 bg-gray-900 p-2 rounded cursor-pointer"><input type="checkbox" id="fxInnerShadow"> <span>Inner Shadow</span></label>
                                <label class="flex items-center space-x-2 bg-gray-900 p-2 rounded cursor-pointer"><input type="checkbox" id="fx3D"> <span>3D Text Effect</span></label>
                                <label class="flex items-center space-x-2 bg-gray-900 p-2 rounded cursor-pointer"><input type="checkbox" id="fxReflection"> <span>Reflection</span></label>
                                <label class="flex items-center space-x-2 bg-gray-900 p-2 rounded cursor-pointer"><input type="checkbox" id="fxEmboss"> <span>Emboss / Glow</span></label>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="image-tab" class="tab-content hidden space-y-4">
                    <div>
                        <label class="block text-xs text-gray-400 uppercase mb-2">Import Assets</label>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="file" id="imageLoader" accept="image/*" class="hidden">
                            <button onclick="document.getElementById('imageLoader').click()" class="bg-gray-700 hover:bg-gray-600 p-2.5 rounded text-xs text-center font-medium">📂 Add Image/PNG</button>
                            <select id="stickerLoader" class="bg-gray-700 hover:bg-gray-600 p-2.5 rounded text-xs font-medium focus:outline-none">
                                <option value="">🎭 Add Sticker/Emoji</option>
                                <option value="😊">😊 Smile</option>
                                <option value="🔥">🔥 Fire</option>
                                <option value="👑">👑 Crown</option>
                                <option value="💥">💥 Boom</option>
                                <option value="❤️">❤️ Love</option>
                            </select>
                        </div>
                    </div>

                    <div class="border-t border-gray-700 pt-3">
                        <label class="block text-xs text-gray-400 uppercase mb-2">Vector Shapes</label>
                        <div class="grid grid-cols-3 gap-1.5 text-xs text-center">
                            <button onclick="addShape('rect')" class="bg-gray-900 p-2 rounded hover:bg-gray-750">Rectangle</button>
                            <button onclick="addShape('circle')" class="bg-gray-900 p-2 rounded hover:bg-gray-750">Circle</button>
                            <button onclick="addShape('triangle')" class="bg-gray-900 p-2 rounded hover:bg-gray-750">Triangle</button>
                            <button onclick="addShape('star')" class="bg-gray-900 p-2 rounded hover:bg-gray-750">Star</button>
                            <button onclick="addShape('arrow')" class="bg-gray-900 p-2 rounded hover:bg-gray-750">Arrow</button>
                            <button onclick="addShape('line')" class="bg-gray-900 p-2 rounded hover:bg-gray-750">Line</button>
                        </div>
                    </div>

                    <div class="border-t border-gray-700 pt-3 space-y-3 text-xs">
                        <label class="block text-xs text-gray-400 uppercase">Graphic Adjustments</label>
                        <div class="flex items-center justify-between">
                            <span>Shape/Vector Color</span>
                            <input type="color" id="shapeFill" value="#00ffff" class="w-7 h-7 bg-transparent border-0 cursor-pointer">
                        </div>
                        <div class="flex items-center justify-between">
                            <span>Border Outline</span>
                            <input type="color" id="shapeStrokeColor" value="#ffffff" class="w-7 h-7 bg-transparent border-0 cursor-pointer">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <button id="cropBtn" class="bg-gray-700 p-2 rounded hover:bg-gray-600">Crop Layer</button>
                            <button id="flipXBtn" class="bg-gray-700 p-2 rounded hover:bg-gray-600">Flip Horizontal</button>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">Image Filter Effects</label>
                            <select id="imgFilter" class="w-full bg-gray-900 border border-gray-700 rounded p-1.5 text-xs">
                                <option value="none">Normal (No Filter)</option>
                                <option value="grayscale">Grayscale</option>
                                <option value="sepia">Sepia Vintage</option>
                                <option value="blur">Blur Layer</option>
                                <option value="invert">Invert Colors</option>
                                <option value="removeBg">Remove Background (Chroma)</option>
                            </select>
                        </div>
                        <button id="freehandDraw" class="w-full bg-orange-700 hover:bg-orange-600 p-2 rounded font-medium">🖌️ Toggle Freehand Drawing Pen</button>
                    </div>
                </div>

                <div id="bg-tab" class="tab-content hidden space-y-4 text-xs">
                    <label class="block text-xs text-gray-400 uppercase">Canvas Background Canvas</label>
                    
                    <div class="space-y-3">
                        <label class="flex items-center space-x-2"><input type="radio" name="bgType" value="solid" checked> <span>Solid Color</span></label>
                        <input type="color" id="bgColorInput" value="#111827" class="w-full h-8 bg-transparent cursor-pointer">
                        
                        <label class="flex items-center space-x-2"><input type="radio" name="bgType" value="gradient"> <span>Gradient Fill</span></label>
                        
                        <label class="flex items-center space-x-2"><input type="radio" name="bgType" value="transparent"> <span>Transparent Canvas (PNG master)</span></label>
                        
                        <label class="flex items-center space-x-2"><input type="radio" name="bgType" value="image"> <span>Custom Background Image</span></label>
                        <input type="file" id="bgImageLoader" accept="image/*" class="w-full">
                    </div>
                </div>

            </div>
        </aside>

        <main class="flex-1 bg-gray-950 flex flex-col items-center justify-center relative p-4 select-none">
            
            <div class="absolute top-4 left-4 bg-gray-800 px-3 py-1.5 rounded-full text-xs flex items-center space-x-3 border border-gray-700 z-10">
                <button onclick="zoomCanvas(0.9)" class="hover:text-cyan-400 font-bold px-1">➖</button>
                <span id="zoomLevel">Zoom: 100%</span>
                <button onclick="zoomCanvas(1.1)" class="hover:text-cyan-400 font-bold px-1">➕</button>
                <button onclick="resetZoom()" class="text-gray-400 text-[10px] uppercase border border-gray-600 px-1.5 py-0.5 rounded">Reset</button>
            </div>

            <div id="canvas-wrapper" class="shadow-2xl border-2 border-dashed border-gray-700 overflow-hidden bg-[url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAoAAAAKCAYAAACNMs+9AAAAGElEQVQYlWNgYGCQwoKxgqGgcJA5h3yFAAf2AENWD4z2AAAAAElFTkSuQmCC')]">
                <canvas id="mainPixelCanvas"></canvas>
            </div>
            
            <p class="text-gray-500 text-[11px] mt-3">💡 Tip: Use Mouse Scroll / Drag layers freely. Double click texts to change content.</p>
        </main>

        <aside class="w-64 bg-gray-800 border-l border-gray-700 flex flex-col">
            <div class="p-3 border-b border-gray-700 flex justify-between items-center">
                <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400">Layer Manager</h3>
                <span class="text-[10px] bg-gray-700 px-2 py-0.5 rounded text-gray-300" id="layerCount">0 Layers</span>
            </div>
            
            <div id="layerListContainer" class="flex-1 overflow-y-auto p-2 space-y-1.5 text-xs">
                <p class="text-center text-gray-500 mt-10 italic">No layers present
